<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:site_name" content="VaginaWave">
  <meta property="og:type" content="music.playlist">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{image}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body data-route="shared">
  <canvas id="topo" class="topo" aria-hidden="true"></canvas>

  <div class="shell shell--share">
    <main class="view" id="view" tabindex="-1"></main>
    <div class="mini" id="mini" hidden></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="topo.js"></script>
  <script type="module" src="js/share.js"></script>
</body>
</html>
